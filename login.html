<!DOCTYPE html>
<html>
<head>
  <title>Student Quiz Platform - Sign In</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; width:100%; overflow-x:hidden; }
    
    body {
      font-family:'Segoe UI', Arial, sans-serif;
      background-image:url('https://images.unsplash.com/photo-1537995882-8b5b7b3b3f3f?q=80&w=2070&auto=format');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      background-attachment:fixed;
      min-height:100vh;
      overflow-y:auto;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    
    body::before {
      content:"";
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.4);
      z-index:1;
    }
    
    .auth-container {
      position:relative;
      z-index:2;
      width:100%;
      max-width:420px;
      padding:20px;
      margin:auto;
    }
    
    .auth-card {
      background:#ffffff;
      border-radius:16px;
      padding:40px 30px;
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
      animation:slideUp 0.5s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity:0;
        transform:translateY(30px);
      }
      to {
        opacity:1;
        transform:translateY(0);
      }
    }
    
    .logo-section {
      text-align:center;
      margin-bottom:30px;
    }
    
    .logo-icon {
      font-size:3em;
      margin-bottom:10px;
    }
    
    .logo-title {
      font-size:1.8em;
      color:#1e3c72;
      font-weight:bold;
      margin-bottom:5px;
    }
    
    .logo-subtitle {
      color:#666;
      font-size:0.9em;
    }
    
    .tab-buttons {
      display:flex;
      gap:10px;
      margin-bottom:30px;
      border-bottom:2px solid #f0f0f0;
    }
    
    .tab-btn {
      flex:1;
      padding:12px 0;
      background:none;
      border:none;
      font-size:1em;
      font-weight:600;
      cursor:pointer;
      color:#999;
      border-bottom:3px solid transparent;
      transition:all 0.3s;
    }
    
    .tab-btn.active {
      color:#1e3c72;
      border-bottom-color:#1e3c72;
    }
    
    .tab-btn:hover {
      color:#555;
    }
    
    .form-group {
      margin-bottom:20px;
      display:none;
    }
    
    .form-group.active {
      display:block;
    }
    
    .form-group label {
      display:block;
      margin-bottom:8px;
      color:#333;
      font-weight:600;
      font-size:0.95em;
    }
    
    .phone-input-wrap {
      display:flex;
      align-items:center;
      gap:8px;
    }
    
    .country-code {
      background:#f5f5f5;
      border:2px solid #e0e0e0;
      border-radius:10px;
      padding:12px;
      font-weight:600;
      color:#333;
      min-width:80px;
      text-align:center;
      font-size:0.95em;
    }
    
    .phone-input {
      flex:1;
    }
    
    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"] {
      width:100%;
      padding:12px 15px;
      border:2px solid #e0e0e0;
      border-radius:10px;
      font-size:0.95em;
      transition:all 0.3s;
      font-family:inherit;
    }
    
    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="tel"]:focus {
      outline:none;
      border-color:#1e3c72;
      box-shadow:0 0 0 3px rgba(30,60,114,0.1);
    }
    
    .form-group input::placeholder {
      color:#999;
    }
    
    .password-toggle {
      position:relative;
    }
    
    .toggle-btn {
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      cursor:pointer;
      color:#666;
      font-size:1.2em;
    }
    
    .auth-btn {
      width:100%;
      padding:14px;
      background:linear-gradient(135deg, #1e3c72, #2a5298);
      color:white;
      border:none;
      border-radius:10px;
      font-size:1em;
      font-weight:bold;
      cursor:pointer;
      transition:all 0.3s;
      margin-top:10px;
    }
    
    .auth-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(30,60,114,0.4);
    }
    
    .auth-btn:active {
      transform:translateY(0);
    }
    
    .auth-btn.loading {
      background:linear-gradient(135deg, #999, #bbb);
      cursor:not-allowed;
    }
    
    .divider {
      text-align:center;
      margin:20px 0;
      position:relative;
      color:#999;
      font-size:0.9em;
    }
    
    .divider::before {
      content:"";
      position:absolute;
      left:0;
      top:50%;
      width:45%;
      height:1px;
      background:#e0e0e0;
    }
    
    .divider::after {
      content:"";
      position:absolute;
      right:0;
      top:50%;
      width:45%;
      height:1px;
      background:#e0e0e0;
    }
    
    .social-buttons {
      display:flex;
      gap:10px;
      margin-top:20px;
    }
    
    .social-btn {
      flex:1;
      padding:12px;
      background:#f5f5f5;
      border:2px solid #e0e0e0;
      border-radius:10px;
      cursor:pointer;
      font-size:1.5em;
      transition:all 0.3s;
    }
    
    .social-btn:hover {
      background:#e8e8e8;
      border-color:#1e3c72;
    }
    
    .loading-spinner {
      display:none;
      width:20px;
      height:20px;
      border:3px solid #fff;
      border-top-color:transparent;
      border-radius:50%;
      animation:spin 0.8s linear infinite;
      margin-right:8px;
    }
    
    @keyframes spin {
      to { transform:rotate(360deg); }
    }
    
    .auth-btn.loading .loading-spinner {
      display:inline-block;
    }
    
    .message {
      padding:12px 15px;
      border-radius:10px;
      margin-bottom:15px;
      font-size:0.9em;
      display:none;
    }
    
    .message.error {
      background:#ffebee;
      color:#c62828;
      border-left:4px solid #c62828;
      display:block;
    }
    
    .message.success {
      background:#e8f5e9;
      color:#2e7d32;
      border-left:4px solid #2e7d32;
      display:block;
    }
    
    @media(max-width:500px) {
      .auth-card {
        padding:30px 20px;
      }
      
      .logo-title {
        font-size:1.5em;
      }
      
      .logo-icon {
        font-size:2.5em;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <!-- Logo Section -->
      <div class="logo-section">
        <div class="logo-icon">🎓</div>
        <div class="logo-title">EduQuiz</div>
        <div class="logo-subtitle">Online Exam System</div>
      </div>
      
      <!-- Tabs -->
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>
      
      <!-- Messages -->
      <div id="message" class="message"></div>
      
      <!-- SIGN IN FORM -->
      <div id="signin-form" class="form-group active">
        <label>Phone Number</label>
        <div class="phone-input-wrap">
          <div class="country-code">+251</div>
          <input type="tel" id="signin-phone" class="phone-input" placeholder="9 XXXXXXXX" maxlength="9">
        </div>
        
        <label style="margin-top:20px;">Password</label>
        <div class="password-toggle">
          <input type="password" id="signin-password" placeholder="Enter your password">
          <button class="toggle-btn" onclick="togglePassword('signin-password')">👁️</button>
        </div>
        
        <button class="auth-btn" onclick="handleSignIn()">
          <span class="loading-spinner"></span>
          Sign In
        </button>
      </div>
      
      <!-- SIGN UP FORM -->
      <div id="signup-form" class="form-group">
        <label>Full Name</label>
        <input type="text" id="signup-name" placeholder="Enter your full name">
        
        <label style="margin-top:15px;">Email</label>
        <input type="email" id="signup-email" placeholder="Enter your email">
        
        <label style="margin-top:15px;">Phone Number</label>
        <div class="phone-input-wrap">
          <div class="country-code">+251</div>
          <input type="tel" id="signup-phone" class="phone-input" placeholder="9 XXXXXXXX" maxlength="9">
        </div>
        
        <label style="margin-top:15px;">Password</label>
        <div class="password-toggle">
          <input type="password" id="signup-password" placeholder="Create a password (min. 6 characters)">
          <button class="toggle-btn" onclick="togglePassword('signup-password')">👁️</button>
        </div>
        
        <label style="margin-top:15px;">Confirm Password</label>
        <div class="password-toggle">
          <input type="password" id="signup-confirm" placeholder="Confirm your password">
          <button class="toggle-btn" onclick="togglePassword('signup-confirm')">👁️</button>
        </div>
        
        <button class="auth-btn" onclick="handleSignUp()">
          <span class="loading-spinner"></span>
          Create Account
        </button>
      </div>
      
      <!-- Divider -->
      <div class="divider">OR</div>
      
      <!-- Social Buttons -->
      <div class="social-buttons">
        <button class="social-btn" title="Sign in with Google">G</button>
        <button class="social-btn" title="Sign in with Facebook">f</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, signInWithPhoneNumber, RecaptchaVerifier } 
      from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, query, where, getDocs }
      from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:"AIzaSyAavkqPwNgzo3UASsz-feaQvTjobxwkj-s",
      authDomain:"student-quiz-platform-9439a.firebaseapp.com",
      projectId:"student-quiz-platform-9439a",
      storageBucket:"student-quiz-platform-9439a.firebasestorage.app",
      messagingSenderId:"815750551646",
      appId:"1:815750551646:web:1c48edb729252bd667bccf"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.switchTab = function(tab) {
      const signinForm = document.getElementById('signin-form');
      const signupForm = document.getElementById('signup-form');
      const tabs = document.querySelectorAll('.tab-btn');
      
      tabs.forEach(t => t.classList.remove('active'));
      
      if (tab === 'signin') {
        signinForm.classList.add('active');
        signupForm.classList.remove('active');
        tabs[0].classList.add('active');
      } else {
        signupForm.classList.add('active');
        signinForm.classList.remove('active');
        tabs[1].classList.add('active');
      }
      
      clearMessages();
    };

    window.togglePassword = function(id) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    };

    function showMessage(text, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = 'message ' + type;
    }

    function clearMessages() {
      const messageEl = document.getElementById('message');
      messageEl.className = 'message';
      messageEl.textContent = '';
    }

    window.handleSignIn = async function() {
      clearMessages();
      const phone = document.getElementById('signin-phone').value.trim();
      const password = document.getElementById('signin-password').value;
      
      if (!phone || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
      }
      
      if (phone.length !== 9) {
        showMessage('Phone number must be 9 digits', 'error');
        return;
      }

      try {
        const fullPhone = '+251' + phone;
        const btn = event.target;
        btn.classList.add('loading');
        btn.disabled = true;

        // Check if user exists in Firestore
        const usersRef = collection(db, 'users');
        const q = query(usersRef, where('phone', '==', fullPhone));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          showMessage('User not found. Please sign up first.', 'error');
          btn.classList.remove('loading');
          btn.disabled = false;
          return;
        }

        // Simulate successful login
        localStorage.setItem('user_phone', fullPhone);
        localStorage.setItem('user_id', snapshot.docs[0].id);
        
        showMessage('Sign in successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);

      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
        if (event.target) {
          event.target.classList.remove('loading');
          event.target.disabled = false;
        }
      }
    };

    window.handleSignUp = async function() {
      clearMessages();
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const phone = document.getElementById('signup-phone').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;

      if (!name || !email || !phone || !password || !confirm) {
        showMessage('Please fill in all fields', 'error');
        return;
      }

      if (phone.length !== 9) {
        showMessage('Phone number must be 9 digits', 'error');
        return;
      }

      if (password.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        return;
      }

      if (password !== confirm) {
        showMessage('Passwords do not match', 'error');
        return;
      }

      if (!email.includes('@')) {
        showMessage('Please enter a valid email', 'error');
        return;
      }

      try {
        const fullPhone = '+251' + phone;
        const btn = event.target;
        btn.classList.add('loading');
        btn.disabled = true;

        // Check if user already exists
        const usersRef = collection(db, 'users');
        const q = query(usersRef, where('phone', '==', fullPhone));
        const snapshot = await getDocs(q);

        if (!snapshot.empty) {
          showMessage('Phone number already registered', 'error');
          btn.classList.remove('loading');
          btn.disabled = false;
          return;
        }

        // Create user document
        const userDocRef = doc(collection(db, 'users'));
        await setDoc(userDocRef, {
          name: name,
          email: email,
          phone: fullPhone,
          password: btoa(password),
          createdAt: new Date(),
          courses: [],
          scores: {}
        });

        localStorage.setItem('user_phone', fullPhone);
        localStorage.setItem('user_id', userDocRef.id);

        showMessage('Account created successfully! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);

      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
        if (event.target) {
          event.target.classList.remove('loading');
          event.target.disabled = false;
        }
      }
    };

    // Check if already logged in
    const userPhone = localStorage.getItem('user_phone');
    if (userPhone) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
